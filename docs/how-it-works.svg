<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="940" height="280" role="img" aria-labelledby="title desc">
  <title id="title">How compaction-guard works</title>
  <desc id="desc">When Claude Code is about to compact a conversation, compaction-guard runs three steps: 1, save a copy; 2, check its hash; 3, write a receipt. If all three work, the compaction runs (exit 0). If any of them fails, step 4 blocks the compaction (exit 2): nothing is lost, and the reason is shown.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .slate { fill: #57606a; }
    .blue { fill: #0969da; }
    .green { fill: #1a7f37; }
    .red { fill: #cf222e; }
    .head { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .sub { fill: #ffffff; font-size: 12.5px; }
    .badge { fill: #ffffff; stroke-width: 2; }
    .badge.blue { stroke: #0969da; }
    .badge.red { stroke: #cf222e; }
    .num { font-size: 13px; font-weight: 700; }
    .num.blue { fill: #0969da; }
    .num.red { fill: #cf222e; }
    .line { fill: none; stroke: #57606a; stroke-width: 2; }
    .tip { fill: #57606a; }
    .label { fill: #57606a; font-size: 13px; text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #9198a1; }
      .tip, .label { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="tip" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- The normal path: left to right. -->
  <rect class="slate" x="4" y="36" width="166" height="72" rx="10"/>
  <text class="head" x="87" y="68">Claude Code</text>
  <text class="sub" x="87" y="88">is about to compact</text>

  <rect class="blue" x="196" y="36" width="166" height="72" rx="10"/>
  <text class="head" x="279" y="68">Save a copy</text>
  <text class="sub" x="279" y="88">streamed and flushed</text>

  <rect class="blue" x="388" y="36" width="166" height="72" rx="10"/>
  <text class="head" x="471" y="68">Check its hash</text>
  <text class="sub" x="471" y="88">SHA-256, read back</text>

  <rect class="blue" x="580" y="36" width="166" height="72" rx="10"/>
  <text class="head" x="663" y="68">Write a receipt</text>
  <text class="sub" x="663" y="88">to index.jsonl</text>

  <rect class="green" x="772" y="36" width="166" height="72" rx="10"/>
  <text class="head" x="855" y="68">Compaction runs</text>
  <text class="sub" x="855" y="88">exit 0</text>

  <line class="line" x1="172" y1="72" x2="194" y2="72" marker-end="url(#arrow)"/>
  <line class="line" x1="364" y1="72" x2="386" y2="72" marker-end="url(#arrow)"/>
  <line class="line" x1="556" y1="72" x2="578" y2="72" marker-end="url(#arrow)"/>
  <line class="line" x1="748" y1="72" x2="770" y2="72" marker-end="url(#arrow)"/>

  <circle class="badge blue" cx="212" cy="36" r="12"/>
  <text class="num blue" x="212" y="40.5">1</text>
  <circle class="badge blue" cx="404" cy="36" r="12"/>
  <text class="num blue" x="404" y="40.5">2</text>
  <circle class="badge blue" cx="596" cy="36" r="12"/>
  <text class="num blue" x="596" y="40.5">3</text>

  <!-- The failure path: any of steps 1 to 3 leads down to 4. -->
  <path class="line" d="M279 112 V136 H663 V112"/>
  <line class="line" x1="471" y1="112" x2="471" y2="196" marker-end="url(#arrow)"/>
  <text class="label" x="483" y="170">if any step fails</text>

  <rect class="red" x="290" y="200" width="362" height="72" rx="10"/>
  <text class="head" x="471" y="232">Block the compaction</text>
  <text class="sub" x="471" y="252">exit 2: nothing is lost, and the reason is shown</text>
  <circle class="badge red" cx="306" cy="200" r="12"/>
  <text class="num red" x="306" y="204.5">4</text>
</svg>
